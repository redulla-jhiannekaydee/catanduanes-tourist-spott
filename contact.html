    </head>
    <body>
    <header>
        <h1>Catanduanes Tourist Spots</h1>
        <p><i>Uncover the beauty of Catanduanes, the Happy Island.</i></p>
    </header>

     <!-- navbar -->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

    <!-- contact -->
    <main>
        <h2>Contact Information</h2>
        <p>Here's how you can reach Kaydee, the owner:</p>

        <ul>
            <li><a href = "mailto:jhiannekd.rdl@gmail.com">Email Address</a></li>
            <li><a href = "https://www.facebook.com/share/1DbBjywHTD/">Facebook Account</a></li>
        </ul>

        <form id="contactForm">
            <fieldset>
                <legend>Your details</legend>
                    <p>
                        <label for="name">Name:</label><br>
                        <input type="text" id="name" name="name" placeholder="Dela Cruz, Juan A." required><br><br>
                    </p>

                    <p>
                        <label for="emailAdd">Email Address:</label><br>
                        <input type="email" id="emailAdd" name="emailAdd" placeholder="juan.delacruz@example.com" required><br><br>
                    </p>
            </fieldset>

            <fieldset>
                <legend>Nature of Inquiry</legend>
                    <p>
                        <label for="subject">Subject:</label><br>
                        <select id="subject" name="subject">
                            <option value="">-- Select --</option>
                            <option value="suggest-place">Suggest a Place</option>
                            <option value="correct-detail">Correct a Detail</option>
                            <option value="ask-question">Ask a Question</option>
                            <option value="other-inquiry">Other Inquiry</option>
                        </select>
                    </p>
            </fieldset>

            <p>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="5" placeholder="How can we help you?" required></textarea><br><br>
            </p>
            <button type="submit">Send message</button>
        </form>
    </main>

    <!--footer part-->
    <footer>

    </footer>
    </body>
</html>
